name: Auto Build MockForge Docker

on:
  workflow_dispatch:
    inputs:
      version:
        description: '选择 MockForge 版本'
        required: true
        default: 'latest'
        type: choice
        options:
          - latest
          - v0.3.212
          - v0.3.210

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: 获取并确定版本号
        id: get_version
        run: |
          if [ "${{ github.event.inputs.version }}" = "latest" ]; then
            VERSION=$(curl -s https://api.github.com/repos/saasy-solutions/mockforge/releases/latest | jq -r .tag_name)
          else
            VERSION=${{ github.event.inputs.version }}
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "✅ 最终构建版本：$VERSION"

      - name: 打印构建信息
        run: |
          echo "====================================="
          echo "📦 选择的版本：${{ github.event.inputs.version }}"
          echo "🚀 实际构建版本：${{ env.VERSION }}"
          echo "🖥 架构：amd64 + arm64"
          echo "====================================="

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
   
      - name: Install ARM64 dependencies
        run: |
                sudo dpkg --add-architecture arm64
                sudo apt-get update
                sudo apt-get install -y \
                gcc-aarch64-linux-gnu \
                libssl-dev:arm64 \
                pkg-config-aarch64-linux-gnu
    
      - name: Clone mockforge 指定版本源码
        run: |
          git clone -b ${{ env.VERSION }} --single-branch https://github.com/saasy-solutions/mockforge.git mockforge-src

      - name: 写入修复版 Dockerfile
        run: |
          cat > ./mockforge-src/Dockerfile.build << 'EOF'
          # 匹配项目要求的Rust版本
          FROM rust:1.83-slim AS builder
          WORKDIR /build

          RUN apt-get update && apt-get install -y --no-install-recommends \
              git \
              build-essential \
              protobuf-compiler \
              libssl-dev \
              ca-certificates \
              && rm -rf /var/lib/apt/lists/*

          COPY . .
          # ✅ Mockforge 真实二进制名字：mockforge‑cli
          RUN cargo build --release --bin mockforge-cli --features cloud

          FROM debian:bookworm-slim
          RUN apt-get update && apt-get install -y --no-install-recommends \
              curl ca-certificates libssl3 \
              && rm -rf /var/lib/apt/lists/*

          COPY --from=builder /build/target/release/mockforge-cli /usr/local/bin/mockforge
          EXPOSE 3000 3001 9080
          ENTRYPOINT ["mockforge","serve"]
          EOF

      - name: 构建并推送多架构镜像
        uses: docker/build-push-action@v6
        with:
          context: ./mockforge-src
          file: ./mockforge-src/Dockerfile.build
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/mockforge:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/mockforge:${{ env.VERSION }}
