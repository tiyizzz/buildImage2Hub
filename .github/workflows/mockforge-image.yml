name: Auto Build MockForge Docker

on:
  workflow_dispatch:
    inputs:
      version:
        description: '选择 MockForge 版本'
        required: true
        default: 'latest'
        type: choice
        options:
          - latest
          - v0.3.212
          - v0.3.210

env:
  DOCKER_REPO: ${{ secrets.DOCKER_HUB_USERNAME }}/mockforge

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 获取版本号
        id: get_version
        run: |
          if [ "${{ github.event.inputs.version }}" = "latest" ]; then
            VERSION=$(curl -s https://api.github.com/repos/saasy-solutions/mockforge/releases/latest | jq -r .tag_name)
          else
            VERSION=${{ github.event.inputs.version }}
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Clone mockforge 源码
        run: git clone -b ${{ env.VERSION }} --single-branch https://github.com/saasy-solutions/mockforge.git src

      - name: 写入修复版Dockerfile
        run: |
          cat > ./src/Dockerfile << 'EOF'
          FROM rust:1.83-slim AS builder
          WORKDIR /build

          RUN apt-get update && apt-get install -y --no-install-recommends \
              git build-essential protobuf-compiler libssl-dev ca-certificates \
              && rm -rf /var/lib/apt/lists/*

          COPY . .
          WORKDIR /build/crates/cli
          RUN cargo build --release --bin mockforge-cli

          FROM debian:bookworm-slim
          RUN apt-get update && apt-get install -y --no-install-recommends \
              curl ca-certificates libssl3 \
              && rm -rf /var/lib/apt/lists/*

          COPY --from=builder /build/crates/cli/target/release/mockforge-cli /usr/local/bin/mockforge
          EXPOSE 3000 3001 9080
          ENTRYPOINT ["mockforge","serve"]
          EOF

      - name: Build & Push amd64
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.DOCKER_REPO }}:${{ env.VERSION }}-amd64

  build-arm64:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 获取版本号
        id: get_version
        run: |
          if [ "${{ github.event.inputs.version }}" = "latest" ]; then
            VERSION=$(curl -s https://api.github.com/repos/saasy-solutions/mockforge/releases/latest | jq -r .tag_name)
          else
            VERSION=${{ github.event.inputs.version }}
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Clone mockforge 源码
        run: git clone -b ${{ env.VERSION }} --single-branch https://github.com/saasy-solutions/mockforge.git src

      - name: 写入修复版Dockerfile
        run: |
          cat > ./src/Dockerfile << 'EOF'
          FROM rust:1.83-slim AS builder
          WORKDIR /build

          RUN apt-get update && apt-get install -y --no-install-recommends \
              git build-essential protobuf-compiler libssl-dev ca-certificates \
              && rm -rf /var/lib/apt/lists/*

          COPY . .
          WORKDIR /build/crates/cli
          RUN cargo build --release --bin mockforge-cli

          FROM debian:bookworm-slim
          RUN apt-get update && apt-get install -y --no-install-recommends \
              curl ca-certificates libssl3 \
              && rm -rf /var/lib/apt/lists/*

          COPY --from=builder /build/crates/cli/target/release/mockforge-cli /usr/local/bin/mockforge
          EXPOSE 3000 3001 9080
          ENTRYPOINT ["mockforge","serve"]
          EOF

      - name: Build & Push arm64
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.DOCKER_REPO }}:${{ env.VERSION }}-arm64

  merge-manifest:
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: 获取版本号
        id: get_version
        run: |
          if [ "${{ github.event.inputs.version }}" = "latest" ]; then
            VERSION=$(curl -s https://api.github.com/repos/saasy-solutions/mockforge/releases/latest | jq -r .tag_name)
          else
            VERSION=${{ github.event.inputs.version }}
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: 合并多架构镜像清单
        run: |
          docker manifest create ${{ env.DOCKER_REPO }}:${{ env.VERSION }} \
            ${{ env.DOCKER_REPO }}:${{ env.VERSION }}-amd64 \
            ${{ env.DOCKER_REPO }}:${{ env.VERSION }}-arm64
          docker manifest push ${{ env.DOCKER_REPO }}:${{ env.VERSION }}

          docker manifest create ${{ env.DOCKER_REPO }}:latest \
            ${{ env.DOCKER_REPO }}:${{ env.VERSION }}-amd64 \
            ${{ env.DOCKER_REPO }}:${{ env.VERSION }}-arm64
          docker manifest push ${{ env.DOCKER_REPO }}:latest
