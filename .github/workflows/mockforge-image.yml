# 工作流名称
name: Build MockForge ARM image

# 触发条件
on:
  # 手动触发（下拉选择版本）
  workflow_dispatch:
    inputs:
      version:
        description: '选择 MockForge 版本'
        required: true
        default: 'latest'
        type: choice
        options:
          - latest
          - v0.3.214
          - v0.3.213
          - v0.3.212

# 定义任务
jobs:
  build-arm:
    # 原生 ARM64 runner，无需 QEMU，编译速度接近本地
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出本仓库（仅用于挂载工作流）
        uses: actions/checkout@v4

      # ==========================================
      # 解析版本号：latest 走 GitHub API，否则用指定 tag
      # ==========================================
      - name: 获取并确定版本号
        id: get_version
        run: |
          if [ "${{ github.event.inputs.version }}" = "latest" ]; then
            VERSION=$(curl -s https://api.github.com/repos/SaaSy-Solutions/mockforge/releases/latest | jq -r .tag_name)
            if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
              # 回退：取最新的 tag
              VERSION=$(curl -s https://api.github.com/repos/SaaSy-Solutions/mockforge/tags | jq -r '.[0].name')
            fi
          else
            VERSION=${{ github.event.inputs.version }}
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "✅ 最终构建版本：$VERSION"

      - name: 打印构建信息
        run: |
          echo "====================================="
          echo "📦 选择的版本：${{ github.event.inputs.version }}"
          echo "🚀 实际构建版本：${{ env.VERSION }}"
          echo "🖥 架构：linux/arm64（原生）"
          echo "====================================="

      # 登录 Docker Hub（使用配置的密钥）
      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # 克隆指定版本的 mockforge 源码
      - name: Clone MockForge at specified version
        run: |
          git clone -b ${{ env.VERSION }} --single-branch https://github.com/SaaSy-Solutions/mockforge.git mockforge-src

      # ==========================================
      # 关键补丁：SQLX 离线编译
      # 官方 Dockerfile 未声明 SQLX_OFFLINE，
      # sqlx 在编译期会尝试联网校验查询 → 必须注入离线模式
      # ==========================================
      - name: 注入 SQLX_OFFLINE 环境变量
        run: |
          sed -i '/^FROM rust:/a ENV SQLX_OFFLINE=true' mockforge-src/Dockerfile
          echo "📝 已在 Rust 构建阶段注入 SQLX_OFFLINE=true"
          grep -n "SQLX_OFFLINE" mockforge-src/Dockerfile

      # 原生 arm64 构建并推送（单架构，无需 buildx 多架构合成）
      - name: 构建并推送 ARM64 镜像
        uses: docker/build-push-action@v5
        with:
          context: ./mockforge-src
          file: ./mockforge-src/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/mockforge:latest-arm64
            ${{ secrets.DOCKER_HUB_USERNAME }}/mockforge:${{ env.VERSION }}-arm64
