# 工作流名称
name: Auto Build MockForge Multi-Arch Docker

# 触发条件：仅支持手动触发（可添加 push/tag 触发）
on:
  workflow_dispatch:
    inputs:
      version:
        description: '选择 MockForge 版本（输入 latest 自动获取最新，或输入具体版本号，如 0.3.214）'
        required: true
        default: 'latest'
        type: string   # 使用字符串输入，更灵活

# 定义任务
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # 如需推送至 GHCR 则保留，这里我们推 Docker Hub 但可保留

    steps:
      - name: 检出代码（仅用于后续克隆，也可直接 clone）
        uses: actions/checkout@v4

      # 步骤1：设置 QEMU（支持多架构模拟）
      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      # 步骤2：设置 Docker Buildx（支持多平台构建）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      # 步骤3：获取版本号（处理 latest 和具体版本）
      - name: 获取并确定版本号
        id: get_version
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"
          if [ "$INPUT_VERSION" = "latest" ]; then
            # 从 GitHub API 获取最新 release 的 tag_name
            VERSION=$(curl -s https://api.github.com/repos/SaaSy-Solutions/mockforge/releases/latest | jq -r .tag_name)
            # 去除可能的 v 前缀（如 v0.3.214 -> 0.3.214），保留原样
          else
            VERSION="$INPUT_VERSION"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "✅ 最终构建版本：$VERSION"

      - name: 打印构建信息
        run: |
          echo "====================================="
          echo "📦 选择的版本：${{ github.event.inputs.version }}"
          echo "🚀 实际构建版本：${{ env.VERSION }}"
          echo "🖥 架构：linux/amd64 + linux/arm64"
          echo "====================================="

      # 步骤4：登录 Docker Hub（使用配置的 Secrets）
      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # 步骤5：克隆指定版本的 MockForge 代码
      - name: Clone MockForge at specified version
        run: |
          # 版本可能带有 v 前缀，git tag 通常也带，我们直接使用 TAG 变量
          TAG="${{ env.VERSION }}"
          # 如果版本是数字开头（如 0.3.214），git tag 是 v0.3.214，需要加上 v
          # 但有些版本可能 tag 就是数字，先尝试直接克隆，失败则加 v
          git clone -b "$TAG" --single-branch https://github.com/SaaSy-Solutions/mockforge.git mockforge || \
          git clone -b "v$TAG" --single-branch https://github.com/SaaSy-Solutions/mockforge.git mockforge

      # 步骤6：多架构构建并推送镜像
      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: ./mockforge          # 指向克隆下来的代码目录
          file: ./mockforge/Dockerfile  # Dockerfile 路径
          platforms: linux/amd64,linux/arm64
          push: true
          # 如果 MockForge 的 Dockerfile 需要构建参数，可以在这里添加
          # build-args: |
          #   VERSION=${{ env.VERSION }}
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/mockforge:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/mockforge:${{ env.VERSION }}
          # 利用 GitHub Actions 缓存加速
          cache-from: type=gha
          cache-to: type=gha,mode=max
