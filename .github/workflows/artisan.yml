# 工作流名称
name: Auto Build Artisan Docker

# 触发条件：推送到main分支、创建v开头的标签时触发
on:
  # push:
  #   branches: [ "main" ]  # 替换为你的主分支（如master）
  #   tags: [ 'v*' ]        # 标签以v开头时触发（如v1.0.0）
  # 可选：手动触发（方便测试）
  workflow_dispatch: 
    # 👇 核心：手动触发时显示下拉框选择版本
    inputs:
      version:
        description: '选择 Artisan 版本（latest = 自动最新）'
        required: true
        default: 'latest'
        type: choice
        options:
          - latest
          - v4.0.3-beta
          - v4.0.2
          - v4.0.0
          - v3.6-beta
          - v3.4.0
          - v3.2.0
          - v3.1.4
          - v3.1.2
# 定义任务
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        
      # 步骤3：设置 QEMU（多架构构建需要）
      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3     
        
      # 步骤4：设置Docker Buildx（增强构建能力，支持多平台）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true  # 确保安装最新版Buildx，支持多架构
          
      # ==========================================
      # 获取版本：如果选 latest 就自动拿最新，否则用你选的
      # ==========================================
      - name: 获取并确定版本号
        id: get_version
        run: |
          if [ "${{ github.event.inputs.version }}" = "latest" ]; then
            VERSION=$(curl -s https://api.github.com/repos/artisan-roaster-scope/artisan/releases/latest | jq -r .tag_name)
          else
            VERSION=${{ github.event.inputs.version }}
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "✅ 最终构建版本：$VERSION"   
          
      - name: 打印构建信息
        run: |
          echo "====================================="
          echo "📦 选择的版本：${{ github.event.inputs.version }}"
          echo "🚀 实际构建版本：${{ env.VERSION }}"
          echo "🖥  架构：amd64 + arm64"
          echo "🌐 模式：官方 Web 8080"
          echo "====================================="
          
      # 步骤5：登录Docker Hub（使用配置的密钥）
      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # 多架构构建并推送
      - name: 构建并推送
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.artisan  # 这里写你自定义的Dockerfile名称
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/artisan-web:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/artisan-web:${{ env.VERSION }}
